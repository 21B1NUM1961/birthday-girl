<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe4e6" />
      <stop offset="50%" stop-color="#fecdd3" />
      <stop offset="100%" stop-color="#fda4af" />
    </linearGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="dressGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a2e2b" />
      <stop offset="100%" stop-color="#2c1810" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="500" height="500" rx="24" fill="url(#bgGrad)" />

  <!-- Soft Decorative Circles -->
  <circle cx="250" cy="220" r="170" fill="#ffffff" opacity="0.35" filter="url(#softGlow)" />
  <circle cx="100" cy="90" r="45" fill="#ffffff" opacity="0.25" />
  <circle cx="410" cy="120" r="35" fill="#ffffff" opacity="0.2" />

  <!-- Floating Sparkles & Stars -->
  <g fill="#ffd166" opacity="0.85">
    <path d="M 120 180 Q 120 195 105 195 Q 120 195 120 210 Q 120 195 135 195 Q 120 195 120 180" />
    <path d="M 380 170 Q 380 182 368 182 Q 380 182 380 194 Q 380 182 392 182 Q 380 182 380 170" transform="scale(1.2) translate(-50,-30)" />
    <path d="M 250 60 Q 250 70 240 70 Q 250 70 250 80 Q 250 70 260 70 Q 250 70 250 60" />
  </g>

  <!-- Floating Hearts Background -->
  <g fill="url(#heartGrad)" opacity="0.3">
    <path d="M 80,130 C 80,110 50,110 50,130 C 50,145 80,165 80,165 C 80,165 110,145 110,130 C 110,110 80,110 80,130 Z" transform="scale(0.8) translate(30,-20)" />
    <path d="M 400,100 C 400,80 370,80 370,100 C 370,115 400,135 400,135 C 400,135 430,115 430,100 C 430,80 400,80 400,100 Z" transform="scale(0.7) translate(160,20)" />
  </g>

  <!-- Girl / Romantic Silhouette Illustration -->
  <g transform="translate(0, 30)">
    <!-- Hair Back -->
    <path d="M 200 170 Q 180 230 190 310 Q 230 330 250 320 Q 270 330 310 310 Q 320 230 300 170 Z" fill="url(#hairGrad)" />

    <!-- Shoulders & Body / Dress -->
    <path d="M 180 340 Q 250 310 320 340 L 350 450 L 150 450 Z" fill="url(#dressGrad)" />

    <!-- Neck -->
    <rect x="235" y="240" width="30" height="40" rx="10" fill="#fbd3bd" />

    <!-- Face & Ears -->
    <ellipse cx="250" cy="200" rx="42" ry="50" fill="#fed7aa" />
    <ellipse cx="206" cy="205" rx="6" ry="10" fill="#fed7aa" />
    <ellipse cx="294" cy="205" rx="6" ry="10" fill="#fed7aa" />

    <!-- Hair Front / Bangs / Waves -->
    <path d="M 210 180 Q 230 140 250 140 Q 270 140 290 180 Q 270 170 250 172 Q 230 170 210 180 Z" fill="url(#hairGrad)" />
    <path d="M 208 180 Q 200 230 215 270 Q 225 240 220 200 Z" fill="url(#hairGrad)" />
    <path d="M 292 180 Q 300 230 285 270 Q 275 240 280 200 Z" fill="url(#hairGrad)" />

    <!-- Floral Crown on Hair -->
    <g transform="translate(250, 150)">
      <circle cx="-25" cy="0" r="8" fill="#fb7185" />
      <circle cx="-10" cy="-4" r="9" fill="#f43f5e" />
      <circle cx="7" cy="-5" r="9" fill="#fda4af" />
      <circle cx="23" cy="1" r="8" fill="#f43f5e" />
      <circle cx="-10" cy="-4" r="3" fill="#fef08a" />
      <circle cx="7" cy="-5" r="3" fill="#fef08a" />
      <!-- Tiny Leaves -->
      <path d="M -34 2 Q -40 -3 -30 -6 Q -30 0 -34 2 Z" fill="#86efac" />
      <path d="M 32 3 Q 40 -2 32 -7 Q 29 -1 32 3 Z" fill="#86efac" />
    </g>

    <!-- Cheeks (Blushing) -->
    <ellipse cx="228" cy="215" rx="9" ry="5" fill="#fb7185" opacity="0.45" />
    <ellipse cx="272" cy="215" rx="9" ry="5" fill="#fb7185" opacity="0.45" />

    <!-- Cute Closed Eyes (Happy smile) -->
    <path d="M 224 200 Q 232 206 240 200" fill="none" stroke="#4a2e2b" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 260 200 Q 268 206 276 200" fill="none" stroke="#4a2e2b" stroke-width="2.5" stroke-linecap="round" />

    <!-- Sweet Smile -->
    <path d="M 243 226 Q 250 233 257 226" fill="none" stroke="#e11d48" stroke-width="2.5" stroke-linecap="round" />

    <!-- Holding a Big Heart Balloon / Present -->
    <g transform="translate(250, 340)">
      <!-- Big Glowing Heart -->
      <path d="M 0,-40 C -5,-80 -65,-80 -65,-40 C -65,-10 0,30 0,40 C 0,30 65,-10 65,-40 C 65,-80 5,-80 0,-40 Z" fill="url(#heartGrad)" filter="url(#softGlow)" />
      <!-- Heart Highlight -->
      <path d="M -45,-45 C -45,-60 -25,-60 -20,-48" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.6" />
      <!-- Hands holding heart -->
      <ellipse cx="-45" cy="15" rx="14" ry="10" fill="#fed7aa" transform="rotate(-20 -45 15)" />
      <ellipse cx="45" cy="15" rx="14" ry="10" fill="#fed7aa" transform="rotate(20 45 15)" />
    </g>
  </g>

  <!-- Photo replace hint badge -->
  <g transform="translate(250, 470)">
    <rect x="-140" y="-18" width="280" height="28" rx="14" fill="#ffffff" opacity="0.85" />
    <text x="0" y="1" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#be123c">
      📸 Өөрийн зургийг images/photo.jpg болгон солих боломжтой
    </text>
  </g>
</svg>
